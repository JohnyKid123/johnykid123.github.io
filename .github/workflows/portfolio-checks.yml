name: Portfolio checks

on:
  push:
    branches:
      - main
      - redesign/2026-dotnet-portfolio
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js && node --check scripts/smoke-test.mjs
      - name: Install browser test runner
        run: npm install --no-save playwright-core@1.56.1
      - name: Run responsive browser smoke tests
        run: node scripts/smoke-test.mjs
      - name: Upload screenshots when checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-screenshots
          path: test-results/
          if-no-files-found: ignore
